<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Revisão — Normalização</title>
<style>
  :root {
    --bg: #f4f5f7; --card: #ffffff; --ink: #1c2330; --muted: #5b6575;
    --line: #d9dde4; --accent: #1f4e8c; --accent-ink: #ffffff;
    --ok: #17703b; --ok-bg: #e5f4ea; --bad: #a32020; --bad-bg: #fbe9e9;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12161d; --card: #1b212b; --ink: #e8ebf0; --muted: #9aa5b5;
      --line: #313a48; --accent: #6ea4e8; --accent-ink: #0d1117;
      --ok: #6fd094; --ok-bg: #173224; --bad: #f08a8a; --bad-bg: #3a1c1c;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.55 Georgia, "Times New Roman", serif;
  }
  main { max-width: 780px; margin: 0 auto; padding: 24px 16px 64px; }
  header h1 { font-size: 1.35rem; margin: 0 0 2px; letter-spacing: .01em; }
  header p { margin: 0; color: var(--muted); font-size: .95rem; }
  header { border-bottom: 2px solid var(--accent); padding-bottom: 12px; margin-bottom: 20px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 20px; }
  label.field { display: block; margin: 14px 0 4px; font-weight: bold; font-size: .95rem; }
  input[type=text] {
    width: 100%; padding: 10px 12px; font: inherit; color: var(--ink);
    background: var(--bg); border: 1px solid var(--line); border-radius: 6px;
  }
  button {
    font: inherit; font-weight: bold; padding: 10px 18px; border-radius: 6px; cursor: pointer;
    border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink);
  }
  button.sec { background: transparent; color: var(--accent); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
  .meta { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 6px;
          color: var(--muted); font-size: .9rem; margin-bottom: 10px; }
  .bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin-bottom: 16px; }
  .bar div { height: 100%; background: var(--accent); }
  .tema { font-size: .82rem; text-transform: uppercase; letter-spacing: .06em; color: var(--accent); font-weight: bold; }
  .enun { margin: 8px 0 16px; }
  .enun p { margin: 0 0 10px; }
  .opt { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; margin: 8px 0;
         border: 1px solid var(--line); border-radius: 6px; cursor: pointer; }
  .opt input { margin-top: 5px; }
  .opt.errada { opacity: .55; text-decoration: line-through; cursor: not-allowed; }
  .opt.certa { border-color: var(--ok); background: var(--ok-bg); }
  .fb { margin-top: 16px; padding: 12px 14px; border-radius: 6px; border-left: 5px solid; }
  .fb.ok { background: var(--ok-bg); border-color: var(--ok); }
  .fb.bad { background: var(--bad-bg); border-color: var(--bad); }
  .fb strong.t { display: block; margin-bottom: 4px; }
  .fb.ok strong.t { color: var(--ok); } .fb.bad strong.t { color: var(--bad); }
  .nivelrow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-bottom: 6px; }
  .nivelrow .tema { margin: 0; }
  .nv { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: .8rem; font-weight: bold; border: 1px solid; white-space: nowrap; }
  .nv::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: currentColor; }
  .nv.basico { color: #17703b; background: #e4f4e9; border-color: #8fd0a4; }
  .nv.intermediario { color: #7a5600; background: #fff4cc; border-color: #e8c24a; }
  .nv.avancado { color: #a32020; background: #fde8e6; border-color: #eea39b; }
  .legenda { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 4px; }
  .erro { color: var(--bad); font-size: .92rem; margin-top: 8px; min-height: 1.2em; }
  .score { font-size: 2.4rem; font-weight: bold; color: var(--accent); margin: 6px 0; }
  .tw { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: .92rem; margin-top: 12px; }
  th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  td.ok { color: var(--ok); font-weight: bold; } td.bad { color: var(--bad); font-weight: bold; }
  ul.est { padding-left: 20px; } ul.est li { margin-bottom: 8px; }
  .nota { color: var(--muted); font-size: .9rem; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Revisão — Normalização</h1>
    <p>Banco de Dados · 20 questões objetivas · em ordem aleatória</p>
  </header>
  <div id="app" class="card"></div>
</main>

   Com a URL preenchida, o resultado é enviado automaticamente ao professor ao finalizar.
   Vazia, a página apenas oferece o download do relatório. */
var URL_ENVIO = "https://script.google.com/macros/s/AKfycbxBus0NaKf5HkAUNwyBRDueFkdj_oo0GJTNuDmWOabpUksFSHd4cKaGIhMHshTp05Tu/exec";
var NIVEIS = { basico: "Básico", intermediario: "Intermediário", avancado: "Avançado" };
var ORDEM_NIVEL = ["basico", "intermediario", "avancado"];
var SORTEIO = 20; /* quantidade de questões sorteadas do banco para cada aluno */
var CHAVE = "bdn_revisao_v1";
var CHAVE_N = "bdn_revisao_v1_tentativas";
var app = document.getElementById("app");
var S = carregar();

function carregar() {
  try {
    var t = localStorage.getItem(CHAVE);
    if (t) {
      var s = JSON.parse(t);
      /* sessões iniciadas em versão anterior da página: completa os campos de tempo */
      ["t", "dur", "exp"].forEach(function (k) { if (!s[k]) s[k] = s.ord.map(function () { return k === "exp" ? false : null; }); });
      return s;
    }
  } catch (e) {}
  return null;
}
function salvar() { try { localStorage.setItem(CHAVE, JSON.stringify(S)); } catch (e) {} }
function numTentativaGeral(incrementar) {
  var n = 0;
  try { n = parseInt(localStorage.getItem(CHAVE_N) || "0", 10) || 0; } catch (e) {}
  if (incrementar) { n++; try { localStorage.setItem(CHAVE_N, String(n)); } catch (e) {} }
  return n;
}
function el(tag, attrs, filhos) {
  var e = document.createElement(tag);
  if (attrs) for (var k in attrs) {
    if (k === "text") e.textContent = attrs[k];
    else if (k === "onclick") e.onclick = attrs[k];
    else e.setAttribute(k, attrs[k]);
  }
  (filhos || []).forEach(function (f) { if (f) e.appendChild(f); });
  return e;
}
function p2(n) { return (n < 10 ? "0" : "") + n; }
function fData(ms) { var d = new Date(ms); return p2(d.getDate()) + "/" + p2(d.getMonth() + 1) + "/" + d.getFullYear(); }
function fHora(ms) { var d = new Date(ms); return p2(d.getHours()) + ":" + p2(d.getMinutes()) + ":" + p2(d.getSeconds()); }
function fDur(ms) { var s = Math.round(ms / 1000); return p2(Math.floor(s / 3600)) + ":" + p2(Math.floor(s % 3600 / 60)) + ":" + p2(s % 60); }
function QQ(i) { return QUESTOES[S.ord[i]]; }
function resolvida(i) { var t = S.q[i]; return t.length > 0 && t[t.length - 1] === QQ(i).c; }
function acertoPrimeira(i) { return S.q[i][0] === QQ(i).c; }
function pontos() { var n = 0; for (var i = 0; i < S.ord.length; i++) if (acertoPrimeira(i)) n++; return n; }
function embaralhar(a) {
  for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
  return a;
}
/* Todas as questões, em ordem aleatória (diferente para cada aluno). */
function sortear() { return embaralhar(QUESTOES.map(function (_, i) { return i; })); }
function selo(nv) { return el("span", { "class": "nv " + nv, text: "Nível " + NIVEIS[nv].toLowerCase() }); }
function siglaNivel(nv) { return nv === "basico" ? "B" : nv === "intermediario" ? "I" : "A"; }
function porNivel() {
  var r = {}; ORDEM_NIVEL.forEach(function (nv) { r[nv] = [0, 0]; });
  S.ord.forEach(function (_, i) { var nv = QQ(i).nivel; r[nv][1]++; if (acertoPrimeira(i)) r[nv][0]++; });
  return r;
}
function resumoNiveis() { var r = porNivel(); return ORDEM_NIVEL.map(function (nv) { return NIVEIS[nv] + " " + r[nv][0] + "/" + r[nv][1]; }).join(" · "); }

var idxNaTela = -1;
function render() {
  if (relogio) { clearInterval(relogio); relogio = null; }
  app.innerHTML = "";
  if (!S) return telaInicio();
  if (S.fim) return telaFim();
  telaQuestao();
  if (idxNaTela !== S.idx) window.scrollTo(0, 0);   /* só volta ao topo ao trocar de questão */
  idxNaTela = S.idx;
}

function telaInicio() {
  var nome = el("input", { type: "text", id: "nome", autocomplete: "name", maxlength: "120" });
  var ra = el("input", { type: "text", id: "ra", inputmode: "numeric", maxlength: "20" });
  var erro = el("div", { "class": "erro", role: "alert" });
  app.appendChild(el("p", { text: "Identifique-se para iniciar. O horário de início é registrado ao clicar em \"Iniciar\" e o de término, ao finalizar a última questão." }));
  app.appendChild(el("label", { "class": "field", "for": "nome", text: "Nome completo" }));
  app.appendChild(nome);
  app.appendChild(el("label", { "class": "field", "for": "ra", text: "RA" }));
  app.appendChild(ra);
  app.appendChild(erro);
  app.appendChild(el("p", { "class": "nota", text: "São 20 questões objetivas sobre normalização, sem limite de tempo: as alternativas ficam liberadas desde a abertura de cada questão e você responde no seu ritmo. As questões aparecem em ordem aleatória, e cada uma indica o seu nível: básico, intermediário ou avançado. A pontuação considera os acertos na primeira tentativa. Em caso de erro, você recebe a indicação do assunto a estudar e pode tentar novamente; todas as tentativas são registradas. Ao final, " + (URL_ENVIO ? "o resultado é enviado automaticamente ao professor; mantenha a conexão com a internet." : "é gerado um relatório em arquivo .html que deve ser enviado ao professor.") }));
  app.appendChild(el("div", { "class": "legenda" }, ORDEM_NIVEL.map(selo)));
  app.appendChild(el("div", { "class": "actions" }, [el("button", { text: "Iniciar", onclick: function () {
    var n = nome.value.replace(/\s+/g, " ").trim(), r = ra.value.trim();
    if (n.split(" ").length < 2 || n.length < 5) { erro.textContent = "Informe o nome completo (nome e sobrenome)."; return; }
    if (r.length < 3) { erro.textContent = "Informe o RA."; return; }
    var ord = sortear();
    S = { nome: n, ra: r, inicio: Date.now(), fim: null, idx: 0, geral: numTentativaGeral(true),
          id: Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 10), envio: null,
          ord: ord, q: ord.map(function () { return []; }),
          t: ord.map(function () { return null; }), dur: ord.map(function () { return null; }), exp: ord.map(function () { return false; }) };
    salvar(); render();
  } })]));
}

var relogio = null;
function segundos(i) { return (Date.now() - S.t[i]) / 1000; }
function tempoQ(i) { return S.dur[i] == null ? "-" : Math.round(S.dur[i] / 1000) + " s"; }

function telaQuestao() {
  var i = S.idx, Q = QQ(i), total = S.ord.length, tent = S.q[i], ok = resolvida(i), ultima = i === total - 1;
  if (!S.t[i]) { S.t[i] = Date.now(); salvar(); }           /* o relógio da questão começa quando ela é aberta */
  var fechada = ok;

  app.appendChild(el("div", { "class": "meta" }, [
    el("span", { text: "Questão " + (i + 1) + " de " + total }),
    el("span", { text: S.nome + " · RA " + S.ra })
  ]));
  var barra = el("div", { "class": "bar" }, [el("div")]);
  barra.firstChild.style.width = (i / total * 100) + "%";
  app.appendChild(barra);

  app.appendChild(el("div", { "class": "nivelrow" }, [selo(Q.nivel), el("div", { "class": "tema", text: Q.tema })]));
  app.appendChild(el("div", { "class": "enun" }, Q.enun.map(function (t) { return el("p", { text: t }); })));

  var grupo = el("div", { role: "radiogroup" });
  var btnConf = el("button", { text: "Confirmar resposta" });
  btnConf.disabled = true;
  Q.op.forEach(function (texto, k) {
    var letra = LETRAS[k], jaErrou = tent.indexOf(letra) >= 0 && letra !== Q.c;
    var inp = el("input", { type: "radio", name: "op", value: letra, id: "op" + k });
    if (fechada || jaErrou) inp.disabled = true;
    if (ok && letra === Q.c) inp.checked = true;
    inp.onchange = function () { btnConf.disabled = false; };
    var cls = "opt" + (jaErrou ? " errada" : "") + (ok && letra === Q.c ? " certa" : "");
    grupo.appendChild(el("label", { "class": cls, "for": "op" + k }, [inp, el("span", { text: "(" + letra + ") " + texto })]));
  });
  app.appendChild(grupo);

  if (ok) {
    app.appendChild(el("div", { "class": "fb ok", role: "status" }, [
      el("strong", { "class": "t", text: "Resposta correta." }),
      el("span", { text: tent.length === 1 ? "Acerto na primeira tentativa." : "Acerto na " + tent.length + "ª tentativa (não pontua, pois houve erro anterior)." })
    ]));
  } else if (tent.length > 0) {
    app.appendChild(el("div", { "class": "fb bad", role: "alert" }, [
      el("strong", { "class": "t", text: "Resposta incorreta. Tentativas nesta questão: " + tent.length + "." }),
      el("span", { text: "Assunto para estudar: " + Q.tema + ". " + Q.estudo + " Você pode tentar novamente." })
    ]));
  }

  btnConf.onclick = function () {
    var m = grupo.querySelector("input:checked");
    if (!m) return;
    tent.push(m.value);
    if (m.value === Q.c) S.dur[i] = Date.now() - S.t[i];
    salvar(); render();
  };
  var avancar = el("button", { "class": fechada ? "" : "sec", text: ultima ? "Finalizar questionário" : "Próxima questão", onclick: function () {
    if (S.dur[i] == null) S.dur[i] = Date.now() - S.t[i];
    if (ultima) { S.fim = Date.now(); salvar(); render(); if (!URL_ENVIO) baixarRelatorio(); }
    else { S.idx++; salvar(); render(); }
  } });
  var botoes = [];
  if (!fechada) { btnConf.textContent = tent.length ? "Tentar novamente" : "Confirmar resposta"; botoes.push(btnConf); }
  if (fechada || tent.length > 0) botoes.push(avancar);
  app.appendChild(el("div", { "class": "actions" }, botoes));

}

function resultadoTexto(i) {
  if (acertoPrimeira(i)) return "ACERTOU na 1ª tentativa";
  if (resolvida(i)) return "ERROU; acertou na " + S.q[i].length + "ª tentativa";
  return "ERROU; não chegou à resposta correta";
}

function telaFim() {
  var pts = pontos(), total = S.ord.length;
  app.appendChild(el("div", { "class": "tema", text: "Resultado final" }));
  app.appendChild(el("div", { "class": "score", text: pts + " / " + total + "  (" + Math.round(pts / total * 100) + "%)" }));
  app.appendChild(el("p", { text: S.nome + " · RA " + S.ra }));
  app.appendChild(el("p", { text: "Acertos por nível: " + resumoNiveis() }));
  app.appendChild(el("p", { "class": "nota", text: "Data: " + fData(S.inicio) + " · Início: " + fHora(S.inicio) + " · Término: " + fHora(S.fim) + " · Duração: " + fDur(S.fim - S.inicio) + " · Realização nº " + S.geral + " neste navegador" }));

  var tb = el("tbody");
  S.ord.forEach(function (_, i) {
    var Q = QQ(i), okp = acertoPrimeira(i);
    tb.appendChild(el("tr", null, [
      el("td", { text: String(i + 1) }), el("td", null, [selo(Q.nivel)]), el("td", { text: Q.tema }),
      el("td", { text: String(S.q[i].length) }),
      el("td", { "class": okp ? "ok" : "bad", text: okp ? "Acertou" : (resolvida(i) ? "Errou (acertou depois)" : "Errou") })
    ]));
  });
  app.appendChild(el("div", { "class": "tw" }, [el("table", null, [
    el("thead", null, [el("tr", null, [el("th", { text: "Nº" }), el("th", { text: "Nível" }), el("th", { text: "Assunto" }), el("th", { text: "Tentativas" }), el("th", { text: "Resultado" })])]), tb
  ])]));

  var erradas = S.ord.map(function (_, i) { return i; }).filter(function (i) { return !acertoPrimeira(i); });
  if (erradas.length) {
    app.appendChild(el("h3", { text: "Assuntos para estudar" }));
    app.appendChild(el("ul", { "class": "est" }, erradas.map(function (i) {
      return el("li", { text: "Questão " + (i + 1) + " — " + QQ(i).tema + ": " + QQ(i).estudo });
    })));
  } else {

  }

  app.appendChild(el("div", { "class": "actions" }, [
    el("button", { text: "Baixar relatório (.html)", onclick: baixarRelatorio }),
    el("button", { "class": "sec", text: "Refazer o questionário", onclick: function () {

    statusEnvio();

  } else {
    app.appendChild(el("p", { "class": "nota", text: "Envie o arquivo .html baixado ao professor. Se o download não iniciar automaticamente, use o botão acima." }));
  }
}

/* ---------- Envio automático do resultado ao professor ---------- */
var enviando = false;
function statusEnvio() {
  var d = document.getElementById("envio");
  if (!d) return;
  d.innerHTML = "";
  if (S.envio === "ok") {
    d.className = "fb ok";
    d.appendChild(el("strong", { "class": "t", text: "Resultado enviado ao professor." }));
    d.appendChild(el("span", { text: "Registro confirmado. Você já pode fechar esta página." }));
  } else if (enviando) {
    d.className = "fb";
    d.appendChild(el("strong", { "class": "t", text: "Enviando o resultado ao professor…" }));
    d.appendChild(el("span", { text: "Não feche esta página." }));
  } else {
    d.className = "fb bad";
    d.appendChild(el("strong", { "class": "t", text: "Não foi possível enviar o resultado." }));
    d.appendChild(el("span", { text: "Verifique a conexão com a internet e tente novamente. Não feche esta página nem refaça o questionário antes de enviar. Se o problema persistir, baixe o relatório e entregue-o ao professor." }));
    d.appendChild(el("div", { "class": "actions" }, [el("button", { text: "Tentar enviar novamente", onclick: enviar })]));
  }
}
function dadosEnvio() {
  var pts = pontos(), total = S.ord.length, temas = {}, det = [];
  S.ord.forEach(function (_, i) {
    var Q = QQ(i);
    if (!acertoPrimeira(i)) temas[Q.tema] = (temas[Q.tema] || 0) + 1;
    det.push("P" + p2(i + 1) + "=Q" + p2(S.ord[i] + 1) + siglaNivel(Q.nivel) + "[" + S.q[i].join(",") + "]" + (acertoPrimeira(i) ? "ok" : (resolvida(i) ? "errou;acertou na " + S.q[i].length + "a" : "errou")) + "(" + tempoQ(i).replace(" ", "") + ")");
  });
  return {
    id: S.id, disciplina: SIGLA, nome: S.nome, ra: S.ra, data: fData(S.inicio),
    inicio: fData(S.inicio) + " " + fHora(S.inicio), termino: fData(S.fim) + " " + fHora(S.fim),
    duracao: fDur(S.fim - S.inicio), realizacao: S.geral, pontos: pts, total: total,
    percentual: Math.round(pts / total * 100) + "%",

    detalhe: "Níveis: " + resumoNiveis() + " | " + det.join(" | "), codigo: codigoVerificacao()

}
function enviar() {
  if (enviando || !URL_ENVIO || S.envio === "ok") return;
  enviando = true; statusEnvio();
  /* text/plain evita a verificação prévia (preflight) que o Apps Script não atende. */
  fetch(URL_ENVIO, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(dadosEnvio()), redirect: "follow" })
    .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
    .then(function (j) { if (!j || !j.ok) throw new Error((j && j.erro) || "resposta inválida"); S.envio = "ok"; salvar(); })
    .catch(function () { S.envio = "erro"; salvar(); })
    .then(function () { enviando = false; statusEnvio(); });
}
function codigoVerificacao() {
  var base = [S.nome, S.ra, S.inicio, S.fim, S.geral, pontos(), S.ord.join("."), S.q.map(function (t) { return t.join(""); }).join("|")].join("#");
  return hash("BDN#" + base) + "-" + hash(base + "#UNA");
}

function hash(str) {
  var h = 2166136261;
  for (var i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return ("0000000" + (h >>> 0).toString(16)).slice(-8).toUpperCase();
}

function esc(t) { return String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }

function gerarRelatorio() {
  var pts = pontos(), total = S.ord.length;
  var tentTotal = S.q.reduce(function (a, t) { return a + t.length; }, 0);
  var codigo = codigoVerificacao();
  var linhas = "", temas = {};
  S.ord.forEach(function (_, i) {
    var Q = QQ(i), okp = acertoPrimeira(i);
    if (!okp) temas[Q.tema] = (temas[Q.tema] || 0) + 1;
    linhas += "<tr><td>" + (i + 1) + "</td><td>Q" + p2(S.ord[i] + 1) + "</td><td>" + NIVEIS[Q.nivel] + "</td><td>" + esc(Q.tema) + "</td><td>" + S.q[i].length + "</td><td>" + tempoQ(i) +
      "</td><td>" + esc(S.q[i].join(", ") || "-") + "</td><td>" + Q.c + "</td><td class='" + (okp ? "ok" : "bad") + "'>" + esc(resultadoTexto(i)) + "</td></tr>";
  });
  var ks = Object.keys(temas);
  var reforco = ks.length ? "<ul>" + ks.map(function (k) { return "<li>" + esc(k) + " — " + temas[k] + " questão(ões) com erro</li>"; }).join("") + "</ul>" : "<p>Nenhum.</p>";
  function dado(r, v) { return "<tr><th>" + r + "</th><td>" + esc(v) + "</td></tr>"; }
  return "<!DOCTYPE html>\n<html lang='pt-BR'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1'>" +
    "<title>Relatório — " + esc(S.nome) + " — RA " + esc(S.ra) + "</title><style>" +
    "body{font:15px/1.5 Georgia,'Times New Roman',serif;color:#1c2330;background:#fff;max-width:900px;margin:0 auto;padding:24px 16px}" +
    "h1{font-size:1.3rem;border-bottom:2px solid #1f4e8c;padding-bottom:8px}h2{font-size:1.05rem;margin-top:26px}" +
    "table{border-collapse:collapse;width:100%}th,td{text-align:left;padding:6px 8px;border-bottom:1px solid #d9dde4;vertical-align:top}" +
    "table.d th{width:190px}.nota{font-size:1.8rem;font-weight:bold;color:#1f4e8c}.ok{color:#17703b;font-weight:bold}.bad{color:#a32020;font-weight:bold}" +
    ".w{overflow-x:auto}.cod{font-family:monospace;color:#5b6575;margin-top:24px}@media print{body{padding:0}}" +
    "</style></head><body>" +
    "<h1>Relatório de Revisão — " + esc(DISCIPLINA) + "</h1>" +
    "<p class='nota'>" + pts + " / " + total + " (" + Math.round(pts / total * 100) + "%)</p>" +
    "<table class='d'>" +
    dado("Nome completo", S.nome) + dado("RA", S.ra) + dado("Data", fData(S.inicio)) +
    dado("Início", fData(S.inicio) + " " + fHora(S.inicio)) + dado("Término", fData(S.fim) + " " + fHora(S.fim)) +
    dado("Duração", fDur(S.fim - S.inicio)) + dado("Realização nº", S.geral + " (neste navegador)") +
    dado("Pontuação", pts + " / " + total + " — acertos na 1ª tentativa") +
    dado("Total de tentativas", tentTotal + " (em " + total + " questões)") +
    dado("Acertos por nível", resumoNiveis()) +
    dado("Questões", total + ", em ordem aleatória") +
    "</table>" +
    "<h2>Detalhamento por questão</h2>" +
    "<div class='w'><table><thead><tr><th>Posição</th><th>Banco</th><th>Nível</th><th>Assunto</th><th>Tentativas</th><th>Tempo</th><th>Respostas</th><th>Gabarito</th><th>Resultado</th></tr></thead><tbody>" +
    linhas + "</tbody></table></div>" +
    "<p><small>Posição = ordem em que a questão apareceu para o aluno; Banco = número da questão no banco.</small></p>" +
    "<h2>Assuntos a reforçar</h2>" + reforco +
    "<p class='cod'>Código de verificação: " + codigo + "</p></body></html>";
}

function baixarRelatorio() {
  var blob = new Blob([gerarRelatorio()], { type: "text/html;charset=utf-8" });
  var a = document.createElement("a");
  var nome = S.nome.normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^A-Za-z0-9]+/g, "_");
  a.href = URL.createObjectURL(blob);
  a.download = "BDN_revisao_RA" + S.ra.replace(/[^A-Za-z0-9]+/g, "") + "_" + nome + ".html";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
}

render();
</script>
